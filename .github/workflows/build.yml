name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Compila APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CarPlayer-apk
          path: app/build/outputs/apk/release/*.apk

      # Avviato a mano (workflow_dispatch): l'APK viene allegato alla release
      # che porta il numero di versione dell'app (versione 1.3 -> tag v1.3).
      - name: Allega l'APK alla release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "Versione app: $V"
          cp app/build/outputs/apk/release/app-release.apk CarPlayer.apk
          gh release upload "v$V" CarPlayer.apk --clobber
